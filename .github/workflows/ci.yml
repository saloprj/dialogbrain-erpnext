name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Frappe ${{ matrix.frappe }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Versions follow frappe's own pyproject.toml (requires-python) and
          # package.json (engines.node) on each branch:
          # version-15: python >=3.10,<3.15, node >=18; version-16: python >=3.14,<3.15, node >=24.
          - frappe: version-15
            python: "3.10"
            node: 18
            mariadb: "10.6"
          - frappe: version-16
            python: "3.14"
            node: 24
            mariadb: "11.8"

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          npm install -g yarn
          # the runner's client insists on TLS; the service container offers none
          printf '[client]\nskip-ssl\n' > ~/.my.cnf

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: bench init
        run: |
          pip install frappe-bench
          bench init --frappe-branch ${{ matrix.frappe }} --skip-redis-config-generation \
            --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch ${{ matrix.frappe }} --skip-assets
          bench get-app dialogbrain $GITHUB_WORKSPACE --skip-assets

      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench new-site test.localhost --db-root-password root --admin-password admin \
            --mariadb-user-host-login-scope='%'
          bench --site test.localhost install-app erpnext dialogbrain
          bench build --app dialogbrain
          # v16 reads translations from compiled catalogs (a full `bench build` makes them);
          # the translation tests compare ours with Frappe's and ERPNext's
          if bench compile-po-to-mo --help >/dev/null 2>&1; then bench compile-po-to-mo; fi
        env:
          CI: "Yes"

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost run-tests --app dialogbrain
        env:
          CI: "Yes"
